<title>Catálogo</title>

<style>
  /* ============================================================
     CONFIGURACIÓN RÁPIDA — ver también el bloque CONFIG en el <script>
     al final del archivo para el ID de la hoja de Google Sheets.
     ============================================================ */

  :root{
    --bg:#050505;
    --bg-card:#0b0b0d;
    --line:#232227;
    --text:#f5f5f7;
    --text-dim:#9a97a3;
    --holo-1:#63F2F0;
    --holo-2:#5788EF;
    --holo-3:#6ACDEC;
    --holo-4:#6D77E6;
    --holo-5:#E2C9F0;
    --holo-6:#DBBFF2;
    --holo-7:#EEF2F1;
    --holo-grad: linear-gradient(115deg, var(--holo-1), var(--holo-2), var(--holo-3), var(--holo-4), var(--holo-5), var(--holo-6), var(--holo-7), var(--holo-1));
    --radius: 18px;
    --price-strike:#B983FF;
    --discount-badge:#7A2CE0;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3, .display{ font-family:'Archivo Black', 'Space Grotesk', sans-serif; letter-spacing:0.5px; }

  ::selection{ background:var(--holo-2); color:#000; }

  /* ---------- holographic shimmer animation ---------- */
  @keyframes holoShift{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }
  .holo-text{
    background:var(--holo-grad);
    background-size:300% 300%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:holoShift 5s ease-in-out infinite;
  }
  .holo-bg-anim{
    background:var(--holo-grad);
    background-size:300% 300%;
    animation:holoShift 6s ease-in-out infinite;
  }

  /* ---------- hero / landing ---------- */
  .hero{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:#020203;
    position:relative;
    overflow:hidden;
    padding:32px;
  }
  /* holographic foil sheen — drifting conic gradient, blurred + blended over black */
  .hero::before{
    content:"";
    position:absolute;
    inset:-30%;
    background:conic-gradient(from 180deg at 50% 50%,
      var(--holo-1), var(--holo-2), var(--holo-4), var(--holo-6),
      var(--holo-5), var(--holo-7), var(--holo-3), var(--holo-1));
    filter:blur(70px) saturate(150%);
    opacity:0.4;
    mix-blend-mode:screen;
    animation:holoDrift 26s linear infinite;
    pointer-events:none;
  }
  /* fine foil crease lines, like crumpled holographic sticker sheet */
  .hero::after{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(25deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 46px),
      radial-gradient(circle at 50% 42%, transparent 0%, rgba(0,0,0,0.55) 58%, rgba(0,0,0,0.94) 100%);
    mix-blend-mode:overlay;
    pointer-events:none;
  }
  @keyframes holoDrift{
    0%{ transform:rotate(0deg) scale(1.15); }
    100%{ transform:rotate(360deg) scale(1.15); }
  }

    -webkit-mask-repeat:no-repeat;
    mask-repeat:no-repeat;
    -webkit-mask-position:center;
    mask-position:center;
    background:var(--holo-grad);
    background-size:300% 300%;
    animation:holoShift 5s ease-in-out infinite;
    filter:drop-shadow(0 0 60px rgba(180,170,255,0.4));
    z-index:1;
  }
  .hero-cta{
    margin-top:44px;
    z-index:1;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:14px 30px;
    border-radius:999px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.03);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:1px;
    text-transform:uppercase;
    text-decoration:none;
    cursor:pointer;
    transition:transform .2s ease, border-color .2s ease, background .2s ease;
  }
  .btn:hover{
    transform:translateY(-2px);
    border-color:transparent;
  }
  .btn-holo{
    position:relative;
    background:var(--holo-grad);
    background-size:300% 300%;
    animation:holoShift 5s ease-in-out infinite;
    color:#0a0a0a;
    border:none;
  }
  .scroll-cue{
    position:absolute;
    bottom:34px;
    left:50%;
    transform:translateX(-50%);
    width:22px;
    height:36px;
    border:2px solid var(--line);
    border-radius:14px;
    z-index:1;
  }
  .scroll-cue::after{
    content:"";
    position:absolute;
    top:6px; left:50%;
    width:4px; height:8px;
    background:var(--holo-3);
    border-radius:2px;
    transform:translateX(-50%);
    animation:scrollDot 1.6s ease-in-out infinite;
  }
  @keyframes scrollDot{
    0%{ opacity:1; top:6px; }
    60%{ opacity:0; top:18px; }
    100%{ opacity:0; top:6px; }
  }

  /* ---------- nav ---------- */
  nav{
    position:sticky;
    top:0;
    z-index:40;
    background:rgba(5,5,5,0.82);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:1240px;
    margin:0 auto;
    padding:14px 22px;
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
  }

  }
  .nav-cats{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    flex:1;
  }
  .cat-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:8px 16px;
    border-radius:999px;
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    cursor:pointer;
    transition:all .18s ease;
    white-space:nowrap;
  }
  .cat-btn:hover{ color:var(--text); border-color:#3b3940; }
  .cat-btn.active{
    color:#050505;
    border-color:transparent;
    background:var(--holo-grad);
    background-size:300% 300%;
    animation:holoShift 5s ease-in-out infinite;
    font-weight:700;
  }
  .search-wrap{
    margin-left:auto;
  }
  .search-input{
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 14px;
    border-radius:999px;
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    width:180px;
    outline:none;
    transition:border-color .18s ease, width .18s ease;
  }
  .search-input:focus{ border-color:var(--holo-3); width:220px; }

  /* ---------- grid ---------- */
  main{ max-width:1240px; margin:0 auto; padding:34px 22px 90px; }
  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
    flex-wrap:wrap;
    gap:8px;
  }
  .section-head h2{ font-size:22px; }
  .count-pill{ color:var(--text-dim); font-size:13px; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:20px;
  }

  .card{
    position:relative;
    border-radius:var(--radius);
    padding:1.5px;
    background:linear-gradient(160deg, #26232c, #131218 40%, #26232c);
    cursor:pointer;
    transition:transform .25s ease;
  }
  .card:hover{ transform:translateY(-5px); }
  .card:hover .card-border{
    background:var(--holo-grad);
    background-size:300% 300%;
    animation:holoShift 3.5s ease-in-out infinite;
  }
  .card-border{
    position:absolute; inset:0;
    border-radius:var(--radius);
    padding:1.5px;
    background:linear-gradient(160deg, #2b2830, #17151b 40%, #2b2830);
    transition:background .3s ease;
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
  }
  .card-inner{
    position:relative;
    background:var(--bg-card);
    border-radius:calc(var(--radius) - 1.5px);
    overflow:hidden;
    height:100%;
    display:flex;
    flex-direction:column;
  }
  .card-media{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    background:#111;
  }
  .card-media img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    transition:transform .5s ease;
  }
  .card:hover .card-media img{ transform:scale(1.06); }
  .card-media::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(120deg, rgba(255,61,203,0.0) 20%, rgba(61,201,255,0.16) 45%, rgba(255,255,255,0.0) 70%);
    background-size:250% 250%;
    background-position:0% 0%;
    opacity:0;
    transition:opacity .3s ease;
    mix-blend-mode:screen;
  }
  .card:hover .card-media::after{
    opacity:1;
    animation:sweep 1.3s ease forwards;
  }
  @keyframes sweep{
    from{ background-position:120% 0%; }
    to{ background-position:-20% 100%; }
  }
  .badge{
    position:absolute;
    top:10px; left:10px;
    background:rgba(5,5,5,0.72);
    border:1px solid rgba(255,255,255,0.14);
    color:var(--text-dim);
    font-size:10.5px;
    letter-spacing:0.8px;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:999px;
    backdrop-filter:blur(6px);
  }
  .badge.condicion-2nd{ color:#f8ff3d; border-color:rgba(248,255,61,0.3); }
  .discount-badge{
    position:absolute;
    top:10px; right:10px;
    background:linear-gradient(135deg, var(--discount-badge), #C24DFF);
    color:#fff;
    font-family:'Archivo Black', sans-serif;
    font-size:11.5px;
    letter-spacing:0.4px;
    padding:5px 10px;
    border-radius:999px;
    box-shadow:0 2px 10px rgba(122,44,224,0.55);
  }

  .card-body{
    padding:14px 16px 16px;
    display:flex;
    flex-direction:column;
    gap:4px;
    flex:1;
  }
  .card-brand{
    font-size:11px;
    letter-spacing:1.4px;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .card-name{
    font-size:15px;
    font-weight:600;
    line-height:1.3;
  }
  .card-meta{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-top:8px;
  }
  .card-size{
    font-size:12px;
    color:var(--text-dim);
    border:1px solid var(--line);
    padding:3px 9px;
    border-radius:999px;
  }
  .price-block{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    line-height:1.25;
  }
  .price-old{
    font-size:12px;
    color:var(--price-strike);
    text-decoration:line-through;
  }
  .card-price{
    font-family:'Archivo Black', sans-serif;
    font-size:15px;
  }
  .card-price.price-discounted{ color:var(--holo-3); }

  .modal-price-block{
    display:flex;
    align-items:baseline;
    gap:12px;
    flex-wrap:wrap;
  }
  .modal-price-old{
    font-size:16px;
    color:var(--price-strike);
    text-decoration:line-through;
  }

  .empty-state{
    text-align:center;
    padding:80px 20px;
    color:var(--text-dim);
  }

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(3,3,4,0.85);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    width:min(920px, 100%);
    max-height:88vh;
    overflow:auto;
    background:var(--bg-card);
    border-radius:20px;
    border:1px solid var(--line);
    display:grid;
    grid-template-columns:1fr 1fr;
    position:relative;
  }
  @media (max-width:720px){ .modal{ grid-template-columns:1fr; } }

  .modal-close{
    position:absolute;
    top:14px; right:14px;
    width:36px; height:36px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    color:var(--text);
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:5;
  }

  .gallery{
    position:relative;
    background:#000;
    aspect-ratio:1/1;
  }
  .gallery img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .gallery-nav{
    position:absolute;
    top:50%; transform:translateY(-50%);
    width:36px; height:36px;
    border-radius:50%;
    background:rgba(5,5,5,0.6);
    border:1px solid rgba(255,255,255,0.16);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:16px;
    user-select:none;
  }
  .gallery-prev{ left:12px; }
  .gallery-next{ right:12px; }
  .gallery-dots{
    position:absolute;
    bottom:12px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px;
  }
  .gallery-dots span{
    width:6px; height:6px; border-radius:50%;
    background:rgba(255,255,255,0.3);
  }
  .gallery-dots span.active{ background:var(--holo-3); }

  /* ---------- outfits carousel ---------- */
  .outfits-section{ max-width:1240px; margin:0 auto; padding:34px 22px 90px; }
  .carousel{
    position:relative;
    max-width:520px;
    margin:0 auto;
  }
  .carousel-viewport{
    position:relative;
    border-radius:var(--radius);
    overflow:hidden;
    aspect-ratio:4/5;
    background:#000;
    border:1.5px solid transparent;
    background-clip:padding-box;
  }
  .carousel-viewport::before{
    content:"";
    position:absolute; inset:0;
    padding:1.5px;
    border-radius:var(--radius);
    background:var(--holo-grad);
    background-size:300% 300%;
    animation:holoShift 5s ease-in-out infinite;
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
    z-index:2;
  }
  .carousel-viewport img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    transition:opacity .35s ease;
  }
  .carousel-caption{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:34px 18px 18px;
    background:linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    color:var(--text);
    font-size:13px;
    text-align:center;
  }
  .carousel .gallery-dots{ bottom:-26px; }
  .carousel .gallery-nav{ z-index:3; }

<script>
/* ============================================================
   CONFIG — edita estos dos valores para conectar tu Google Sheet.
   1) Abre tu hoja en Google Sheets.
   2) Archivo > Compartir > Compartir con otros > Cambia a
      "Cualquier persona con el enlace" = Lector.
   3) Copia el ID de la hoja: en la URL
      https://docs.google.com/spreadsheets/d/ESTE_ES_EL_ID/edit
   4) Pega ese ID abajo en SHEET_ID. SHEET_NAME debe ser el
      nombre exacto de la pestaña (por defecto "Inventario").
   ============================================================ */
const CONFIG = {
  SHEET_ID: '1uVF2wyc8jz8YKa0eKhOp4BtF4ni7toHA',  // <-- pega aquí el ID de tu Google Sheet
  SHEET_NAME: 'Inventario',                        // <-- nombre de la pestaña

  OUTFITS_SHEET_NAME: 'Outfits',                   // <-- nombre de la pestaña de fotos de outfits
};

// Datos de ejemplo usados solo si CONFIG.SHEET_ID está vacío o falla la conexión.
const SAMPLE_DATA = [
  {publicar:'ok', marca:'Adidas', producto:'Gorra MH negra rojo', categoria:'Accesorios', tipo:'Gorra', condicion:'2nd Hand', talla:'L', precio:100000, precioDescuento:80000, fotos:[]},

  {publicar:'ok', marca:'Adidas', producto:'Poncho Adidas', categoria:'Ropa', tipo:'Poncho', condicion:'2nd Hand', talla:'Única', precio:220000, fotos:[]},
  {publicar:'ok', marca:'Asics', producto:'Duomax Gel Azul/Blanco/Rojo', categoria:'Calzado', tipo:'Tenis', condicion:'', talla:'8.5 US', precio:350000, fotos:[]},
  {publicar:'ok', marca:'Champions', producto:'Camiseta Verde Fosforescente', categoria:'Ropa', tipo:'Camiseta', condicion:'2nd Hand', talla:'XL', precio:90000, fotos:[]},
  {publicar:'ok', marca:'Nike', producto:'Gorro Rojo', categoria:'Accesorios', tipo:'Gorro', condicion:'', talla:'Única', precio:150000, fotos:[]},
  {publicar:'ok', marca:'Vans', producto:'Gorro Vans Amarillo', categoria:'Accesorios', tipo:'Gorro', condicion:'', talla:'Única', precio:120000, fotos:[]},
  {publicar:'ok', marca:'Nike', producto:'Croptop 3 Colores', categoria:'Ropa', tipo:'Croptop', condicion:'2nd Hand', talla:'Única', precio:80000, fotos:[]},
  {publicar:'ok', marca:'Hurley', producto:'Jogger Gris', categoria:'Ropa', tipo:'Jogger', condicion:'', talla:'S', precio:130000, fotos:[]},
  {publicar:'ok', marca:'Nike', producto:'Gorra Dri Fit Negra', categoria:'Accesorios', tipo:'Gorra', condicion:'', talla:'S/Ajustable', precio:140000, fotos:[]},
  {publicar:'ok', marca:'Nike', producto:'Croptop Full Blanco Air', categoria:'Ropa', tipo:'Croptop', condicion:'', talla:'M', precio:100000, fotos:[]},
  {publicar:'ok', marca:'Nike', producto:'Esqueleto Con Malla', categoria:'Otros', tipo:'Esqueleto', condicion:'', talla:'Única', precio:90000, fotos:[]},
];

const HOLO_PLACEHOLDER_COLORS = ['#63F2F0','#5788EF','#6ACDEC','#6D77E6','#E2C9F0','#DBBFF2'];

function placeholderImage(name){
  const initials = (name || '?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  let hash = 0;
  for(let i=0;i<(name||'').length;i++){ hash = name.charCodeAt(i) + ((hash<<5)-hash); }
  const c1 = HOLO_PLACEHOLDER_COLORS[Math.abs(hash) % HOLO_PLACEHOLDER_COLORS.length];
  const c2 = HOLO_PLACEHOLDER_COLORS[Math.abs(hash+1) % HOLO_PLACEHOLDER_COLORS.length];
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'>
    <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='${c1}'/><stop offset='100%' stop-color='${c2}'/>
    </linearGradient></defs>
    <rect width='600' height='600' fill='#0b0b0d'/>
    <rect width='600' height='600' fill='url(#g)' opacity='0.16'/>
    <text x='50%' y='54%' font-family='Arial' font-size='120' fill='${c1}' opacity='0.55' text-anchor='middle' dominant-baseline='middle'>${initials}</text>
  </svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

function driveUrlToImage(url){
  if(!url) return null;
  url = String(url).trim();
  if(!url) return null;
  const m = url.match(/\/d\/([a-zA-Z0-9_-]{10,})/) || url.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
  if(m && m[1]){
    // Drive links can be flaky depending on how the file was shared —
    // try the fast Google-hosted thumbnail first, fall back to the classic export URL.
    return {
      src: `https://lh3.googleusercontent.com/d/${m[1]}=w1000`,
      fallback: `https://drive.google.com/uc?export=view&id=${m[1]}`,
    };
  }
  return { src: url, fallback: null }; // assume it's already a direct image URL
}

// Shared <img onerror> handler: try the fallback URL once, then give up to a placeholder.
window.__imgFallback = function(img){
  const fb = img.dataset.fallback;
  if(fb){
    img.dataset.fallback = '';
    img.src = fb;
  } else {
    img.onerror = null;
    img.src = img.dataset.placeholder;
  }
};

function parseGvizJson(text){
  const start = text.indexOf('(');
  const end = text.lastIndexOf(')');
  const json = JSON.parse(text.substring(start+1, end));
  const cols = json.table.cols.map(c => (c.label || '').trim());
  const rows = json.table.rows.map(r => {
    const obj = {};
    r.c.forEach((cell, i) => {
      obj[cols[i]] = cell ? (cell.v !== undefined && cell.v !== null ? cell.v : '') : '';
    });
    return obj;
  });
  return rows;
}

function normalizeRow(raw){
  // Accepts either a Sheet row object (spanish headers) or an already-normalized sample object.
  if(raw.producto !== undefined){
    return {
      publicar: raw.publicar,
      marca: raw.marca || '',
      producto: raw.producto || '',
      categoria: raw.categoria || 'Otros',
      tipo: raw.tipo || '',
      condicion: raw.condicion || '',
      talla: raw.talla || '',
      precio: Number(raw.precio) || 0,
      precioDescuento: Number(raw.precioDescuento) || 0,
      fotos: (raw.fotos || []).map(driveUrlToImage).filter(Boolean),
    };
  }
  const fotos = [raw['Foto 1'], raw['Foto 2'], raw['Foto 3'], raw['Foto 4']]
    .map(driveUrlToImage)
    .filter(Boolean);
  return {
    publicar: raw['Publicar'],
    marca: raw['Marca'] || '',
    producto: raw['Producto'] || '',
    categoria: raw['Categoria'] || 'Otros',
    tipo: raw['Tipo'] || '',
    condicion: raw['Condicion'] || '',
    talla: raw['Talla'] || '',
    precio: Number(raw['Precio']) || 0,
    precioDescuento: Number(raw['Precio con Descuento']) || 0,
    fotos,
  };
}

// Devuelve info de descuento si "Precio con Descuento" está lleno y es menor que el Precio normal.
// "Precio" siempre es el precio de referencia (tachado si hay descuento); "Precio con Descuento"
// es el precio rebajado que se muestra como precio principal.
function getDiscount(p){
  if(p.precioDescuento && p.precioDescuento > 0 && p.precioDescuento < p.precio){
    const pct = Math.round((1 - p.precioDescuento / p.precio) * 100);
    return { active: true, original: p.precio, discounted: p.precioDescuento, pct };
  }
  return { active: false };
}

function formatPrice(n){
  return '$' + Number(n||0).toLocaleString('es-CO');
}

let PRODUCTS = [];
let ACTIVE_CAT = 'Todos';
let GALLERY = { photos: [], index: 0 };

function showBanner(html){
  document.getElementById('configBannerText').innerHTML = html;
  document.getElementById('configBanner').style.display = 'block';
}

async function loadProducts(){
  if(!CONFIG.SHEET_ID){
    showBanner('⚠ El catálogo aún no está conectado a una Google Sheet — estás viendo datos de ejemplo. Configura <code>CONFIG.SHEET_ID</code> al final de <code>index.html</code>. Ver <code>README.md</code>.');
    PRODUCTS = SAMPLE_DATA.map(normalizeRow).filter(p => String(p.publicar).trim().toLowerCase() === 'ok');
    render();
    return;
  }
  if(location.protocol === 'file:'){
    showBanner('⚠ Estás abriendo este archivo directamente desde tu computador (doble clic). Por seguridad, el navegador bloquea que una página abierta así pida datos a Google — por eso ves datos de ejemplo y no las fotos reales. Sube la carpeta a <a href="https://app.netlify.com/drop" target="_blank" rel="noopener">Netlify Drop</a> (gratis, sin cuenta) y ábrelo desde el link que te dé — ahí sí se conecta en vivo con la Google Sheet.');
    PRODUCTS = SAMPLE_DATA.map(normalizeRow).filter(p => String(p.publicar).trim().toLowerCase() === 'ok');
    render();
    return;
  }
  try{
    const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}&headers=1`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('No se pudo leer la hoja (' + res.status + ')');
    const text = await res.text();
    const rows = parseGvizJson(text).map(normalizeRow);
    PRODUCTS = rows.filter(p => String(p.publicar).trim().toLowerCase() === 'ok');
    render();
  }catch(err){
    console.error('Error cargando Google Sheet, usando datos de ejemplo:', err);
    showBanner('⚠ No se pudo leer la Google Sheet configurada (revisa que esté compartida como "Cualquiera con el enlace: Lector" y que el ID/nombre de pestaña en <code>CONFIG</code> sean correctos). Mientras tanto, estás viendo datos de ejemplo.');
    PRODUCTS = SAMPLE_DATA.map(normalizeRow).filter(p => String(p.publicar).trim().toLowerCase() === 'ok');
    render();
  }
}

function currentList(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  return PRODUCTS.filter(p => {
    const matchCat = ACTIVE_CAT === 'Todos' || p.categoria === ACTIVE_CAT;
    const matchQ = !q || (p.producto + ' ' + p.marca + ' ' + p.tipo).toLowerCase().includes(q);
    return matchCat && matchQ;
  });
}

function render(){
  const list = currentList();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  document.getElementById('countPill').textContent = list.length + (list.length === 1 ? ' producto' : ' productos');
  document.getElementById('sectionTitle').textContent = ACTIVE_CAT === 'Todos' ? 'Todos los productos' : ACTIVE_CAT;

  grid.innerHTML = '';
  if(list.length === 0){ empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  list.forEach((p, idx) => {
    const cover = p.fotos[0];
    const coverSrc = cover ? cover.src : placeholderImage(p.producto);
    const coverFallback = cover ? (cover.fallback || '') : '';
    const discount = getDiscount(p);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-border"></div>
      <div class="card-inner">
        <div class="card-media">
          <img src="${coverSrc}" alt="${p.producto}" loading="lazy" data-fallback="${coverFallback}" data-placeholder="${placeholderImage(p.producto)}" onerror="window.__imgFallback(this)">
          ${p.categoria ? `<span class="badge">${p.categoria}</span>` : ''}
          ${discount.active ? `<span class="discount-badge">-${discount.pct}%</span>` : ''}
        </div>
        <div class="card-body">
          <div class="card-brand">${p.marca}</div>
          <div class="card-name">${p.producto}</div>
          <div class="card-meta">
            <span class="card-size">${p.talla || '—'}</span>
            <div class="price-block">
              ${discount.active ? `<span class="price-old">${formatPrice(discount.original)}</span>` : ''}
              <span class="card-price${discount.active ? ' price-discounted' : ''}">${formatPrice(discount.active ? discount.discounted : p.precio)}</span>
            </div>
          </div>
        </div>
      </div>
    `;
    card.addEventListener('click', () => openModal(p));
    grid.appendChild(card);
  });
}

function openModal(p){
  const photos = p.fotos.length ? p.fotos : [{ src: placeholderImage(p.producto), fallback: null }];
  GALLERY = { photos, placeholder: placeholderImage(p.producto), index: 0 };
  const discount = getDiscount(p);
  document.getElementById('modalBrand').textContent = p.marca;
  document.getElementById('modalName').textContent = p.producto;
  document.getElementById('modalPrice').innerHTML = discount.active
    ? `<div class="modal-price-block"><span class="modal-price-old">${formatPrice(discount.original)}</span><span>${formatPrice(discount.discounted)}</span><span class="discount-badge" style="position:static;">-${discount.pct}%</span></div>`
    : formatPrice(p.precio);
  const tags = document.getElementById('modalTags');
  tags.innerHTML = '';
  [p.categoria, p.tipo, p.talla, p.condicion].filter(Boolean).forEach(t => {
    const el = document.createElement('span');
    el.className = 'tag';
    el.textContent = t;
    tags.appendChild(el);
  });
  renderGallery();
  document.getElementById('modalBackdrop').classList.add('open');
}

function renderGallery(){
  const current = GALLERY.photos[GALLERY.index];
  const img = document.getElementById('galleryImg');
  img.src = current.src;
  img.dataset.fallback = current.fallback || '';
  img.dataset.placeholder = GALLERY.placeholder || current.src;
  img.onerror = () => window.__imgFallback(img);
  const dots = document.getElementById('galleryDots');
  dots.innerHTML = '';
  GALLERY.photos.forEach((_, i) => {
    const d = document.createElement('span');
    if(i === GALLERY.index) d.className = 'active';
    dots.appendChild(d);
  });
  const showNav = GALLERY.photos.length > 1;
  document.getElementById('galleryPrev').style.display = showNav ? 'flex' : 'none';
  document.getElementById('galleryNext').style.display = showNav ? 'flex' : 'none';
}

document.getElementById('galleryPrev').addEventListener('click', (e) => {
  e.stopPropagation();
  GALLERY.index = (GALLERY.index - 1 + GALLERY.photos.length) % GALLERY.photos.length;
  renderGallery();
});
document.getElementById('galleryNext').addEventListener('click', (e) => {
  e.stopPropagation();
  GALLERY.index = (GALLERY.index + 1) % GALLERY.photos.length;
  renderGallery();
});
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalBackdrop').addEventListener('click', (e) => {
  if(e.target.id === 'modalBackdrop') closeModal();
});
document.addEventListener('keydown', (e) => {
  if(!document.getElementById('modalBackdrop').classList.contains('open')) return;
  if(e.key === 'Escape') closeModal();
  if(e.key === 'ArrowRight') document.getElementById('galleryNext').click();
  if(e.key === 'ArrowLeft') document.getElementById('galleryPrev').click();
});
function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('open');
}

document.getElementById('navCats').addEventListener('click', (e) => {
  const btn = e.target.closest('.cat-btn');
  if(!btn) return;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  if(btn.dataset.cat === 'Outfits'){
    document.getElementById('catalogo').style.display = 'none';
    document.getElementById('searchInput').closest('.search-wrap').style.display = 'none';
    document.getElementById('outfits').style.display = 'block';
    startOutfitsAutoplay();
    return;
  }
  document.getElementById('outfits').style.display = 'none';
  stopOutfitsAutoplay();
  document.getElementById('searchInput').closest('.search-wrap').style.display = '';
  document.getElementById('catalogo').style.display = '';
  ACTIVE_CAT = btn.dataset.cat;
  render();
});
document.getElementById('searchInput').addEventListener('input', render);

document.getElementById('year').textContent = new Date().getFullYear();

if(CONFIG.WHATSAPP_NUMBER){
  const wa = document.getElementById('waFloat');
  const digits = String(CONFIG.WHATSAPP_NUMBER).replace(/\D/g, '');
  wa.href = `https://wa.me/${digits}?text=${encodeURIComponent(CONFIG.WHATSAPP_MESSAGE || '')}`;
  wa.style.display = 'flex';
}

/* ============================================================
   OUTFITS — carrusel de fotos de gente usando la ropa.
   Se lee de la pestaña "Outfits" de la misma Google Sheet
   (columnas: Publicar, Foto, Descripcion).
   ============================================================ */
let OUTFITS = [];
let outfitIndex = 0;
let outfitsTimer = null;

async function loadOutfits(){
  if(!CONFIG.SHEET_ID) return;
  try{
    const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(CONFIG.OUTFITS_SHEET_NAME || 'Outfits')}&headers=1`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('No se pudo leer la hoja de Outfits (' + res.status + ')');
    const text = await res.text();
    const rows = parseGvizJson(text);
    OUTFITS = rows
      .filter(r => String(r['Publicar'] || '').trim().toLowerCase() === 'ok')
      .map(r => {
        const img = driveUrlToImage(r['Foto']);
        if(!img) return null;
        return { src: img.src, fallback: img.fallback, caption: r['Descripcion'] || '' };
      })
      .filter(Boolean);
  }catch(err){
    console.error('Error cargando Outfits, sección oculta hasta que la hoja tenga la pestaña:', err);
    OUTFITS = [];
  }
  renderOutfitSlide();
}

function renderOutfitSlide(){
  const empty = document.getElementById('outfitsEmpty');
  const carousel = document.getElementById('outfitsCarousel');
  document.getElementById('outfitsCountPill').textContent = OUTFITS.length ? (OUTFITS.length + (OUTFITS.length === 1 ? ' foto' : ' fotos')) : '';
  if(OUTFITS.length === 0){
    empty.style.display = 'block';
    carousel.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  carousel.style.display = 'block';
  if(outfitIndex >= OUTFITS.length) outfitIndex = 0;
  const cur = OUTFITS[outfitIndex];
  const img = document.getElementById('outfitsImg');
  img.src = cur.src;
  img.dataset.fallback = cur.fallback || '';
  img.dataset.placeholder = cur.src;
  img.onerror = () => window.__imgFallback(img);
  document.getElementById('outfitsCaption').textContent = cur.caption || '';
  document.getElementById('outfitsCaption').style.display = cur.caption ? 'block' : 'none';

  const dots = document.getElementById('outfitsDots');
  dots.innerHTML = '';
  OUTFITS.forEach((_, i) => {
    const d = document.createElement('span');
    if(i === outfitIndex) d.className = 'active';
    dots.appendChild(d);
  });
  const showNav = OUTFITS.length > 1;
  document.getElementById('outfitsPrev').style.display = showNav ? 'flex' : 'none';
  document.getElementById('outfitsNext').style.display = showNav ? 'flex' : 'none';
}

function nextOutfit(){
  if(OUTFITS.length === 0) return;
  outfitIndex = (outfitIndex + 1) % OUTFITS.length;
  renderOutfitSlide();
}
function prevOutfit(){
  if(OUTFITS.length === 0) return;
  outfitIndex = (outfitIndex - 1 + OUTFITS.length) % OUTFITS.length;
  renderOutfitSlide();
}
function startOutfitsAutoplay(){
  stopOutfitsAutoplay();
  if(OUTFITS.length > 1){
    outfitsTimer = setInterval(nextOutfit, 4000);
  }
}
function stopOutfitsAutoplay(){
  if(outfitsTimer){ clearInterval(outfitsTimer); outfitsTimer = null; }
}

document.getElementById('outfitsPrev').addEventListener('click', () => { prevOutfit(); startOutfitsAutoplay(); });
document.getElementById('outfitsNext').addEventListener('click', () => { nextOutfit(); startOutfitsAutoplay(); });

const outfitsCarouselEl = document.getElementById('outfitsCarousel');
outfitsCarouselEl.addEventListener('mouseenter', stopOutfitsAutoplay);
outfitsCarouselEl.addEventListener('mouseleave', () => { if(document.getElementById('outfits').style.display !== 'none') startOutfitsAutoplay(); });

// swipe support (mobile)
let touchStartX = null;
outfitsCarouselEl.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].clientX; stopOutfitsAutoplay(); }, { passive: true });
outfitsCarouselEl.addEventListener('touchend', (e) => {
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 40){ dx < 0 ? nextOutfit() : prevOutfit(); }
  touchStartX = null;
  startOutfitsAutoplay();
}, { passive: true });

loadProducts();
loadOutfits();
</script>
</body>
</html>
